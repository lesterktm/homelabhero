name: Check

# Cheap guards on every PR. Catches the two mistakes that would otherwise only
# surface on a real box: a shell script that does not parse, and a version bump
# with no matching CHANGELOG section (which would make the release workflow
# publish empty notes).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every shipped script
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if bash -n "$f" 2>/tmp/syntax.err; then
              echo "ok    $f"
            else
              echo "FAIL  $f"
              echo "::error file=$f::syntax error"
              cat /tmp/syntax.err
              fail=1
            fi
          done < <(git ls-files 'bin/*' '*.sh')
          exit "$fail"

  version-and-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HH_VERSION must have a matching CHANGELOG anchor
        run: |
          set -euo pipefail
          version="$(sed -n 's/^HH_VERSION="\(.*\)"$/\1/p' bin/hh | head -1)"
          if [ -z "$version" ]; then
            echo "::error file=bin/hh::could not read HH_VERSION"
            exit 1
          fi
          anchor="v${version//./-}"
          echo "HH_VERSION is $version, expecting anchor $anchor"

          if ! grep -q "id=\"$anchor\"" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no <a id=\"$anchor\"></a> section for version $version"
            echo
            echo "Bumping HH_VERSION means adding the matching CHANGELOG section,"
            echo "otherwise the release workflow has no notes to publish."
            echo "See \"Linking to a release\" in CHANGELOG.md."
            exit 1
          fi

          if ! grep -q "^## ${version} " CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::anchor $anchor exists but no '## $version (date)' heading follows it"
            exit 1
          fi

          echo "ok: $version has both an anchor and a heading"
